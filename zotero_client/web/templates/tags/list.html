{% extends 'base.html' %}

{% block title %}Tags — Zotero Client{% endblock %}

{% block content %}
<h2>Tags</h2>

{% if tags %}
<table class="table table-hover">
  <thead>
    <tr>
      <th>Tag</th>
      <th>Type</th>
    </tr>
  </thead>
  <tbody>
    {% for tag in tags %}
    <tr>
      <td>{{ tag.tag }}</td>
      <td>{{ 'Manual' if tag.type == 1 else 'Automatic' }}</td>
    </tr>
    {% endfor %}
  </tbody>
</table>
{% else %}
<p class="text-muted">No tags found.</p>
{% endif %}
{% endblock %}
