name: Integration Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:  # Allow manual trigger

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v5
      
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov
      
      - name: Run unit tests
        run: |
          pytest tests/ -v --tb=short -m "not integration"
  
  packaged-wheel:
    name: Packaged Wheel
    runs-on: ubuntu-latest
    needs: unit-tests

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Build the wheel
        run: |
          python -m pip install --upgrade pip
          pip install build
          python -m build --wheel

      - name: Install the wheel into a clean environment
        run: |
          python -m venv /tmp/wheel-env
          /tmp/wheel-env/bin/python -m pip install --upgrade pip
          /tmp/wheel-env/bin/python -m pip install dist/*.whl pytest
          # Smoke-check the console script that ships in the wheel
          /tmp/wheel-env/bin/zot --help > /dev/null

      - name: Exercise the installed package (source tree not importable)
        run: |
          # Run from outside the checkout so `zotero_client` can only resolve
          # to the installed wheel; an editable install reading the source tree
          # is what hid the missing-templates bug from CI in the first place.
          mkdir -p /tmp/wheel-check
          cp tests/test_web/test_packaged_templates.py /tmp/wheel-check/
          cd /tmp/wheel-check
          /tmp/wheel-env/bin/python -c "import zotero_client.web as w; p = w.__file__; print('zotero_client.web from', p); assert 'site-packages' in p, p"
          /tmp/wheel-env/bin/python -m pytest test_packaged_templates.py -v -p no:cacheprovider --no-header

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: unit-tests
    
    steps:
      - uses: actions/checkout@v5
      
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov
          pip install -e .

      - name: Create .env file from secrets
        run: |
          echo "ZOTERO_API_KEY=${{ secrets.ZOTERO_API_KEY }}" > .env
          echo "ZOTERO_USER_ID=${{ secrets.ZOTERO_USER_ID }}" >> .env
          echo "ZOTERO_LIBRARY_TYPE=users" >> .env
          # Verify .env file exists (without revealing secrets)
          if [ -f .env ]; then
            echo "✅ .env file created successfully"
          else
            echo "❌ Failed to create .env file"
            exit 1
          fi
      
      - name: Diagnose Zotero write path (create -> delete)
        env:
          ZOTERO_API_KEY: ${{ secrets.ZOTERO_API_KEY }}
          ZOTERO_USER_ID: ${{ secrets.ZOTERO_USER_ID }}
          ZOTERO_LIBRARY_TYPE: users
        # Diagnostic only: prints HTTP status/body per call, never fails the build.
        continue-on-error: true
        run: python scripts/diagnose_zotero_write.py

      - name: Run integration tests
        env:
          ZOTERO_API_KEY: ${{ secrets.ZOTERO_API_KEY }}
          ZOTERO_USER_ID: ${{ secrets.ZOTERO_USER_ID }}
          ZOTERO_LIBRARY_TYPE: users
        run: |
          pytest tests/test_api/ -v --tb=short -m integration
      
      - name: Test CLI with real credentials
        env:
          ZOTERO_API_KEY: ${{ secrets.ZOTERO_API_KEY }}
          ZOTERO_USER_ID: ${{ secrets.ZOTERO_USER_ID }}
        run: |
          # Always test the help command (no credentials required)
          echo "Testing CLI help..."
          zot --help

          # Skip live API calls if credentials are not configured
          if [ -z "$ZOTERO_API_KEY" ] || [ -z "$ZOTERO_USER_ID" ]; then
            echo "⚠️  Zotero credentials not configured — skipping live API CLI tests"
            exit 0
          fi

          echo "Testing CLI items list..."
          zot items list --limit 5

          echo "Testing CLI collections list..."
          zot collections list

          echo "Testing CLI tags list..."
          zot tags list
      
      - name: Run full test suite with coverage
        env:
          ZOTERO_API_KEY: ${{ secrets.ZOTERO_API_KEY }}
          ZOTERO_USER_ID: ${{ secrets.ZOTERO_USER_ID }}
          ZOTERO_LIBRARY_TYPE: users
        run: |
          pytest tests/ -v --cov=zotero_client --cov-report=xml --cov-report=term
      
      - name: Upload coverage report
        uses: codecov/codecov-action@v7
        with:
          flags: integration
          token: ${{ secrets.CODECOV_TOKEN }}
        continue-on-error: true
