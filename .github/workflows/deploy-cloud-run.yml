name: Deploy to Cloud Run

on:
  workflow_dispatch:

concurrency:
  group: deploy-cloud-run
  cancel-in-progress: false

env:
  SERVICE: zotero-client
  REGION: us-central1

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Check required secrets
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          ZOTERO_API_KEY: ${{ secrets.ZOTERO_API_KEY }}
          ZOTERO_USER_ID: ${{ secrets.ZOTERO_USER_ID }}
          FLASK_SECRET_KEY: ${{ secrets.FLASK_SECRET_KEY }}
        run: |
          missing=0
          for name in GCP_PROJECT_ID GCP_SA_KEY ZOTERO_API_KEY ZOTERO_USER_ID FLASK_SECRET_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::Repository secret $name is not set"
              missing=1
            fi
          done
          exit $missing

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Enable required APIs
        run: gcloud services enable run.googleapis.com cloudbuild.googleapis.com artifactregistry.googleapis.com

      # JSON is valid YAML, and a file avoids --set-env-vars splitting values on commas.
      - name: Write runtime environment file
        env:
          ZOTERO_API_KEY: ${{ secrets.ZOTERO_API_KEY }}
          ZOTERO_USER_ID: ${{ secrets.ZOTERO_USER_ID }}
          FLASK_SECRET_KEY: ${{ secrets.FLASK_SECRET_KEY }}
          ZOTERO_LIBRARY_TYPE: ${{ secrets.ZOTERO_LIBRARY_TYPE || 'users' }}
        run: |
          python3 - <<'EOF' > "$RUNNER_TEMP/env.yaml"
          import json, os
          keys = ["ZOTERO_API_KEY", "ZOTERO_USER_ID", "FLASK_SECRET_KEY", "ZOTERO_LIBRARY_TYPE"]
          print(json.dumps({k: os.environ[k] for k in keys}))
          EOF

      - name: Deploy from source
        run: |
          # Buildpacks only auto-detect a Procfile at the source root, and ours
          # lives in deploy/cloud-run/ to keep the repo root uncluttered, so its
          # start command is passed explicitly via GOOGLE_ENTRYPOINT instead.
          entrypoint=$(sed -n 's/^web: //p' deploy/cloud-run/Procfile)
          gcloud run deploy "$SERVICE" \
            --source . \
            --region "$REGION" \
            --allow-unauthenticated \
            --set-build-env-vars "GOOGLE_ENTRYPOINT=$entrypoint" \
            --env-vars-file "$RUNNER_TEMP/env.yaml" \
            --quiet

      - name: Verify healthcheck
        run: |
          url=$(gcloud run services describe "$SERVICE" --region "$REGION" --format 'value(status.url)')
          echo "Service URL: $url"
          echo "### Deployed to $url" >> "$GITHUB_STEP_SUMMARY"
          for i in 1 2 3 4 5; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$url/healthz") && [ "$code" = 200 ] && { echo "/healthz -> 200"; exit 0; }
            echo "/healthz -> $code, retrying"; sleep 10
          done
          echo "::error::/healthz did not return 200"
          exit 1
